name: Template package release

on:
  workflow_dispatch:
    inputs:
      template_id:
        description: Canonical template package id
        required: true
        type: string
      version:
        description: Canonical semantic version
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: template-release-${{ inputs.template_id }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Template release / macos-14 / Python 3.11
    runs-on: macos-14
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LibreOffice
        run: |
          brew install --cask libreoffice
          echo "/Applications/LibreOffice.app/Contents/MacOS" >> "$GITHUB_PATH"
          "/Applications/LibreOffice.app/Contents/MacOS/soffice" --version | head -n 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r "教案生成器/lesson-plan-docx-generator/requirements.txt" -r "平时成绩记分册生成器/course-gradebook-generator/requirements.txt"

      - name: Require clean current master
        shell: bash
        run: |
          git fetch origin master --tags
          test -z "$(git status --porcelain)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/master)"

      - name: Create and verify release bundle
        shell: bash
        run: |
          python tools/template_package.py release \
            --repo-root . \
            --template-id "${{ inputs.template_id }}" \
            --version "${{ inputs.version }}" \
            --output-dir dist/template-packages \
            --json
          python tools/template_package.py verify-release \
            --repo-root . \
            --release-dir dist/template-packages \
            --json
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.template_tooling.github_release import _validate_plan
          plans = list(Path("dist/template-packages").glob("*.release-plan.json"))
          if len(plans) != 1:
              raise SystemExit(f"expected one release plan, found {len(plans)}")
          _validate_plan(plans[0], Path("."))
          print(json.dumps(json.loads(plans[0].read_text(encoding="utf-8")), ensure_ascii=False))
          PY

      - name: Confirm remote release resources are absent
        shell: bash
        run: |
          TAG="template/${{ inputs.template_id }}/v${{ inputs.version }}"
          set +e
          git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1
          TAG_STATUS=$?
          set -e
          if [ "$TAG_STATUS" -eq 0 ]; then
            echo "tag already exists: ${TAG}" >&2
            exit 1
          fi
          if [ "$TAG_STATUS" -ne 2 ]; then
            echo "could not determine whether tag exists: ${TAG}" >&2
            exit 1
          fi
          set +e
          RELEASE_LOOKUP=$(gh release view "${TAG}" --json tagName 2>&1)
          RELEASE_STATUS=$?
          set -e
          if [ "$RELEASE_STATUS" -eq 0 ]; then
            echo "release already exists: ${TAG}" >&2
            exit 1
          fi
          if ! grep -Eiq 'not found|404' <<<"$RELEASE_LOOKUP"; then
            echo "could not determine whether Release exists: ${RELEASE_LOOKUP}" >&2
            exit 1
          fi

      - name: Publish, download and reverify release
        shell: bash
        run: |
          PLAN="$(find dist/template-packages -maxdepth 1 -name '*.release-plan.json' -print -quit)"
          python -m tools.template_tooling.github_release \
            --repo-root . \
            --plan "${PLAN}" \
            --repository "${{ github.repository }}" \
            --json

      - name: Confirm release workflow worktree is clean
        shell: bash
        run: test -z "$(git status --porcelain)"
