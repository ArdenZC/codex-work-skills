name: Template package CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

concurrency:
  # PR and master-push runs cancel obsolete work; manual and scheduled runs
  # use unique groups so an in-progress full validation is never cancelled.
  # run_id is guaranteed unique for the preserved manual/scheduled groups.
  # head_ref keeps successive synchronize runs for one PR in the same group.
  group: template-ci-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && format('preserved-{0}', github.run_id) || github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify-changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      run_docs: ${{ steps.classify.outputs.run_docs }}
      run_lesson: ${{ steps.classify.outputs.run_lesson }}
      run_gradebook: ${{ steps.classify.outputs.run_gradebook }}
      run_workorder: ${{ steps.classify.outputs.run_workorder }}
      run_courseware: ${{ steps.classify.outputs.run_courseware }}
      run_practice_class: ${{ steps.classify.outputs.run_practice_class }}
      run_whole_course: ${{ steps.classify.outputs.run_whole_course }}
      run_tooling: ${{ steps.classify.outputs.run_tooling }}
      run_release: ${{ steps.classify.outputs.run_release }}
      run_package_contracts: ${{ steps.classify.outputs.run_package_contracts }}
      force_full: ${{ steps.classify.outputs.force_full }}
      classification: ${{ steps.classify.outputs.classification }}
      reason: ${{ steps.classify.outputs.reason }}
      changed_files: ${{ steps.classify.outputs.changed_files }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: classify
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: >-
          python .github/scripts/classify_ci_changes.py
          --event "$GITHUB_EVENT_NAME"
          --base-sha "$PR_BASE_SHA"
          --head-sha "$PR_HEAD_SHA"
          --before-sha "$PUSH_BEFORE_SHA"
          --current-sha "$CURRENT_SHA"
          --output "$GITHUB_OUTPUT"
          --summary "$GITHUB_STEP_SUMMARY"

  documentation-checks:
    name: Documentation checks
    needs: classify-changes
    if: needs.classify-changes.outputs.run_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check diff
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_sha="$PR_BASE_SHA"
            head_sha="$PR_HEAD_SHA"
          else
            base_sha="$PUSH_BEFORE_SHA"
            head_sha="$CURRENT_SHA"
          fi
          git diff --check "$base_sha" "$head_sha"

      - name: Recheck docs-only allowlist
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        shell: bash
        run: >-
          python .github/scripts/classify_ci_changes.py
          --event "$GITHUB_EVENT_NAME"
          --base-sha "$PR_BASE_SHA"
          --head-sha "$PR_HEAD_SHA"
          --before-sha "$PUSH_BEFORE_SHA"
          --current-sha "$CURRENT_SHA"
          --assert-docs-only

      - name: Check Markdown relative links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path.cwd().resolve()
          sources = [
              root / "README.md",
              root / "多Agent兼容规范.md",
              root / "教案生成器" / "简介.md",
              root / "平时成绩记分册生成器" / "简介.md",
              root / "HTML课件生成器" / "简介.md",
              root / "实践课HTML生成器" / "简介.md",
              root / "整门课程编排器" / "简介.md",
              root / "WHOLE-COURSE-ARCHITECTURE-REPORT.md",
          ]
          sources.extend(sorted((root / "docs").rglob("*.md")))
          link_pattern = re.compile(r"\[[^\]]*\]\(([^)\s]+)")
          errors = []
          for source in sources:
              if not source.is_file():
                  errors.append(f"missing documentation source: {source.relative_to(root)}")
                  continue
              text = source.read_text(encoding="utf-8")
              for raw_target in link_pattern.findall(text):
                  target = raw_target.strip().strip("<>")
                  if target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  target = unquote(urlsplit(target).path)
                  candidate = root / target.lstrip("/") if target.startswith("/") else source.parent / target
                  resolved = candidate.resolve()
                  if resolved != root and root not in resolved.parents:
                      errors.append(f"link escapes repository: {source.relative_to(root)} -> {raw_target}")
                  elif not resolved.exists():
                      errors.append(f"missing link target: {source.relative_to(root)} -> {raw_target}")
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"checked relative Markdown links in {len(sources)} file(s)")
          PY

      - name: Check installation entries and template versions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          root = Path.cwd()
          install_paths = [
              root / "教案生成器" / "lesson-plan-docx-generator" / "scripts" / "install.py",
              root / "平时成绩记分册生成器" / "course-gradebook-generator" / "scripts" / "install.py",
              root / "HTML课件生成器" / "courseware-html-generator" / "scripts" / "install.py",
              root / "实践课HTML生成器" / "practice-class-html-generator" / "scripts" / "install.py",
          ]
          missing = [str(path.relative_to(root)) for path in install_paths if not path.is_file()]
          if missing:
              raise SystemExit(f"missing installation entry: {missing}")

          def version_from_manifest(path: Path) -> str:
              template_section = path.read_text(encoding="utf-8").split("generator:", 1)[0]
              match = re.search(r"^  version:\s*([^\s#]+)", template_section, re.MULTILINE)
              if not match:
                  raise SystemExit(f"template version not found: {path}")
              return match.group(1)

          def default_manifest(skill_root: Path, template_id: str) -> Path:
              candidates = sorted((skill_root / "assets" / "templates" / template_id).glob("v*/manifest.yaml"))
              if not candidates:
                  raise SystemExit(f"default manifest not found: {skill_root}")
              return candidates[-1]

          lesson_manifest = default_manifest(
              root / "教案生成器" / "lesson-plan-docx-generator", "lesson-plan"
          )
          gradebook_manifest = default_manifest(
              root / "平时成绩记分册生成器" / "course-gradebook-generator", "course-gradebook"
          )
          lesson_version = version_from_manifest(lesson_manifest)
          gradebook_version = version_from_manifest(gradebook_manifest)
          courseware_manifest = root / "HTML课件生成器" / "courseware-html-generator" / "manifest.yaml"
          courseware_text = courseware_manifest.read_text(encoding="utf-8")
          courseware_match = re.search(r"^  version:\s*([^\s#]+)", courseware_text, re.MULTILINE)
          if not courseware_match:
              raise SystemExit(f"Courseware Skill version not found: {courseware_manifest}")
          courseware_version = courseware_match.group(1)
          practice_manifest = root / "实践课HTML生成器" / "practice-class-html-generator" / "manifest.yaml"
          practice_text = practice_manifest.read_text(encoding="utf-8")
          practice_match = re.search(r"^  version:\s*([^\s#]+)", practice_text, re.MULTILINE)
          if not practice_match:
              raise SystemExit(f"Practice Class Skill version not found: {practice_manifest}")
          practice_version = practice_match.group(1)
          documents = {
              root / "README.md": (lesson_version, gradebook_version, courseware_version, practice_version),
              root / "教案生成器" / "简介.md": (lesson_version,),
              root / "平时成绩记分册生成器" / "简介.md": (gradebook_version,),
              root / "HTML课件生成器" / "简介.md": (courseware_version,),
              root / "实践课HTML生成器" / "简介.md": (practice_version,),
          }
          for document, versions in documents.items():
              text = document.read_text(encoding="utf-8")
              for version in versions:
                  if f"v{version}" not in text:
                      raise SystemExit(f"template version v{version} missing from {document.relative_to(root)}")
          print(f"versions: lesson-plan v{lesson_version}; course-gradebook v{gradebook_version}; courseware {courseware_version}; practice-class {practice_version}")
          PY

      - name: Check WorkOrder Skill facade
        run: python .github/scripts/check_skill_facades.py

      - name: Run HTML Courseware contract tests
        run: >-
          python -m unittest discover
          -s HTML课件生成器/courseware-html-generator/tests
          -p "test_*.py" -v

  package-contracts:
    name: Package contracts / static Ubuntu
    needs: classify-changes
    if: >-
      always() && needs.classify-changes.result == 'success' &&
      (needs.classify-changes.outputs.force_full == 'true' ||
      needs.classify-changes.outputs.run_package_contracts == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            教案生成器/lesson-plan-docx-generator/requirements.txt
            平时成绩记分册生成器/course-gradebook-generator/requirements.txt
            实践任务工单生成器/practice-task-workorder-generator/requirements.txt

      - name: Install Python dependencies
        run: >-
          python .github/scripts/run_timed.py
          --label "dependency setup"
          --
          python -m pip install
          -r 教案生成器/lesson-plan-docx-generator/requirements.txt
          -r 平时成绩记分册生成器/course-gradebook-generator/requirements.txt
          -r 实践任务工单生成器/practice-task-workorder-generator/requirements.txt

      - name: Validate static package contracts
        run: >-
          python .github/scripts/run_timed.py
          --label "static package contracts"
          --
          python .github/scripts/validate_package_contracts.py

      - name: Check WorkOrder Skill facade
        run: python .github/scripts/check_skill_facades.py

      - name: Compile CI and tooling sources
        run: python -m compileall -q ".github/scripts" "tools"

      - name: Run classifier unit tests
        run: python -m unittest discover -s "tests" -p "test_ci_change_classifier.py" -v

      - name: Run workflow contract tests
        run: python -m unittest "tests.test_template_packages.WorkflowContractTests" -v

      - name: Verify package contract worktree is clean
        shell: bash
        run: test -z "$(git status --porcelain)"

  template-tooling:
    name: Template tooling / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs:
      - classify-changes
      - package-contracts
    if: >-
      always() && needs.classify-changes.result == 'success' &&
      needs.package-contracts.result == 'success' &&
      (needs.classify-changes.outputs.force_full == 'true' ||
      needs.classify-changes.outputs.run_tooling == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            教案生成器/lesson-plan-docx-generator/requirements.txt
            平时成绩记分册生成器/course-gradebook-generator/requirements.txt
            实践任务工单生成器/practice-task-workorder-generator/requirements.txt

      - name: Install LibreOffice on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: .github/scripts/install_libreoffice_macos.sh

      - name: Install LibreOffice on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $started = Get-Date
          choco install libreoffice-fresh --yes --no-progress
          $programPaths = @(
            (Join-Path $env:ProgramFiles "LibreOffice\program"),
            (Join-Path ${env:ProgramFiles(x86)} "LibreOffice\program")
          )
          $programPath = $programPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $programPath) { throw "LibreOffice installation path was not found." }
          $soffice = Join-Path $programPath "soffice.com"
          if (-not (Test-Path $soffice)) { throw "LibreOffice command was not found: $soffice" }
          & $soffice --version | Select-Object -First 1
          $seconds = [math]::Round(((Get-Date) - $started).TotalSeconds, 2)
          "- LibreOffice setup: ${seconds}s" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Install Python dependencies
        run: >-
          python .github/scripts/run_timed.py
          --label "dependency setup"
          --
          python -m pip install
          -r 教案生成器/lesson-plan-docx-generator/requirements.txt
          -r 平时成绩记分册生成器/course-gradebook-generator/requirements.txt
          -r 实践任务工单生成器/practice-task-workorder-generator/requirements.txt

      - name: Compile template tooling sources
        run: python -m compileall -q "tools" ".github/scripts" "tests/test_template_package_tooling.py"

      - name: Run template tooling regression tests
        run: >-
          python .github/scripts/run_timed.py
          --label "template tooling tests"
          --
          python -m unittest discover -s "tests" -p "test_template_package_tooling.py" -v

      - name: Verify tooling worktree is clean on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: test -z "$(git status --porcelain)"

      - name: Verify tooling worktree is clean on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) { $status; throw "Tests left changes in the worktree." }

  template-lesson:
    name: Template core lesson-plan / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: classify-changes
    if: >-
      always() && needs.classify-changes.result == 'success' &&
      (needs.classify-changes.outputs.force_full == 'true' ||
      needs.classify-changes.outputs.run_lesson == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            教案生成器/lesson-plan-docx-generator/requirements.txt
            .github/scripts/requirements-ci-lesson-tests.txt

      - name: Install LibreOffice on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: .github/scripts/install_libreoffice_macos.sh

      - name: Install LibreOffice on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $started = Get-Date
          choco install libreoffice-fresh --yes --no-progress
          $programPaths = @(
            (Join-Path $env:ProgramFiles "LibreOffice\program"),
            (Join-Path ${env:ProgramFiles(x86)} "LibreOffice\program")
          )
          $programPath = $programPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $programPath) { throw "LibreOffice installation path was not found." }
          $soffice = Join-Path $programPath "soffice.com"
          if (-not (Test-Path $soffice)) { throw "LibreOffice command was not found: $soffice" }
          & $soffice --version | Select-Object -First 1
          $seconds = [math]::Round(((Get-Date) - $started).TotalSeconds, 2)
          "- LibreOffice setup: ${seconds}s" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Install Python dependencies
        run: >-
          python .github/scripts/run_timed.py
          --label "dependency setup"
          --
          python -m pip install
          -r 教案生成器/lesson-plan-docx-generator/requirements.txt
          -r .github/scripts/requirements-ci-lesson-tests.txt

      - name: Compile lesson sources
        run: python -m compileall -q "教案生成器/lesson-plan-docx-generator" "tests/test_template_packages.py"

      - name: Run lesson-plan core regression tests
        run: >-
          python .github/scripts/run_timed.py
          --label "lesson core tests"
          --
          python .github/scripts/run_test_shards.py
          --suite lesson-content
          --suite lesson-package
          --suite hardening
          --parallel
          -v

      - name: Run lesson-plan skill tests
        run: >-
          python .github/scripts/run_timed.py
          --label "lesson skill tests"
          --
          python -m unittest discover -s "教案生成器/lesson-plan-docx-generator/tests" -p "test_*.py" -v

      - name: Verify lesson worktree is clean on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: test -z "$(git status --porcelain)"

      - name: Verify lesson worktree is clean on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) { $status; throw "Tests left changes in the worktree." }

  template-gradebook:
    name: Template core gradebook / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: classify-changes
    if: >-
      always() && needs.classify-changes.result == 'success' &&
      (needs.classify-changes.outputs.force_full == 'true' ||
      needs.classify-changes.outputs.run_gradebook == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            平时成绩记分册生成器/course-gradebook-generator/requirements.txt
            .github/scripts/requirements-ci-gradebook-tests.txt

      - name: Install LibreOffice on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: .github/scripts/install_libreoffice_macos.sh

      - name: Install LibreOffice on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $started = Get-Date
          choco install libreoffice-fresh --yes --no-progress
          $programPaths = @(
            (Join-Path $env:ProgramFiles "LibreOffice\program"),
            (Join-Path ${env:ProgramFiles(x86)} "LibreOffice\program")
          )
          $programPath = $programPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $programPath) { throw "LibreOffice installation path was not found." }
          $soffice = Join-Path $programPath "soffice.com"
          if (-not (Test-Path $soffice)) { throw "LibreOffice command was not found: $soffice" }
          & $soffice --version | Select-Object -First 1
          $seconds = [math]::Round(((Get-Date) - $started).TotalSeconds, 2)
          "- LibreOffice setup: ${seconds}s" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Install Python dependencies
        run: >-
          python .github/scripts/run_timed.py
          --label "dependency setup"
          --
          python -m pip install
          -r 平时成绩记分册生成器/course-gradebook-generator/requirements.txt
          -r .github/scripts/requirements-ci-gradebook-tests.txt

      - name: Compile gradebook sources
        run: python -m compileall -q "平时成绩记分册生成器/course-gradebook-generator" "tests/test_template_packages.py" ".github/scripts/run_gradebook_tests.py" ".github/scripts/run_gradebook_shards.py"

      - name: Run gradebook core regression tests in parallel semantic shards on Windows
        if: runner.os == 'Windows'
        run: >-
          python .github/scripts/run_gradebook_shards.py
          --group contracts
          --group generation

      - name: Run gradebook core regression tests in sequential semantic shards on macOS
        if: runner.os == 'macOS'
        run: >-
          python .github/scripts/run_gradebook_shards.py
          --sequential
          --group contracts
          --group generation

      - name: Run course-gradebook skill tests
        run: >-
          python .github/scripts/run_timed.py
          --label "gradebook skill tests"
          --
          python -m unittest discover -s "平时成绩记分册生成器/course-gradebook-generator/tests" -p "test_*.py" -v

      - name: Verify gradebook worktree is clean on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: test -z "$(git status --porcelain)"

      - name: Verify gradebook worktree is clean on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) { $status; throw "Tests left changes in the worktree." }

  template-workorder:
    name: Practice WorkOrder / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs:
      - classify-changes
      - package-contracts
    if: >-
      always() && needs.classify-changes.result == 'success' &&
      needs.package-contracts.result == 'success' &&
      (needs.classify-changes.outputs.force_full == 'true' ||
      needs.classify-changes.outputs.run_workorder == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: 实践任务工单生成器/practice-task-workorder-generator/requirements.txt

      - name: Install LibreOffice on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: .github/scripts/install_libreoffice_macos.sh

      - name: Install LibreOffice on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $started = Get-Date
          choco install libreoffice-fresh --yes --no-progress
          $programPaths = @(
            (Join-Path $env:ProgramFiles "LibreOffice\program"),
            (Join-Path ${env:ProgramFiles(x86)} "LibreOffice\program")
          )
          $programPath = $programPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $programPath) { throw "LibreOffice installation path was not found." }
          $soffice = Join-Path $programPath "soffice.com"
          if (-not (Test-Path $soffice)) { throw "LibreOffice command was not found: $soffice" }
          $programPath | Add-Content -Path $env:GITHUB_PATH
          & $soffice --version | Select-Object -First 1
          $seconds = [math]::Round(((Get-Date) - $started).TotalSeconds, 2)
          "- WorkOrder LibreOffice setup: ${seconds}s" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Install Python dependencies
        run: >-
          python .github/scripts/run_timed.py
          --label "workorder dependency setup"
          --
          python -m pip install -r 实践任务工单生成器/practice-task-workorder-generator/requirements.txt

      - name: Check WorkOrder dependencies
        run: python 实践任务工单生成器/practice-task-workorder-generator/scripts/check_dependencies.py --json

      - name: Compile WorkOrder sources
        run: python -m compileall -q 实践任务工单生成器/practice-task-workorder-generator

      - name: Run WorkOrder package and QA tests
        run: >-
          python .github/scripts/run_timed.py
          --label "workorder package tests"
          --
          python -m unittest discover
          -s 实践任务工单生成器/practice-task-workorder-generator/tests
          -p "test_*.py" -v

      - name: Check Cross-Artifact QA entrypoint
        run: python 实践任务工单生成器/practice-task-workorder-generator/scripts/cross_artifact_quality.py --help

      - name: Validate canonical WorkOrder template
        run: >-
          python 实践任务工单生成器/practice-task-workorder-generator/scripts/validate_template.py
          --template 实践任务工单生成器/practice-task-workorder-generator/assets/templates/practice-work-order/v1.0.0/template.docx
          --manifest 实践任务工单生成器/practice-task-workorder-generator/assets/templates/practice-work-order/v1.0.0/manifest.yaml

      - name: Generate software and nursing samples with render smoke
        shell: bash
        run: |
          set -euo pipefail
          workorder_dir="$RUNNER_TEMP/workorder-phase2"
          mkdir -p "$workorder_dir"
          python "实践任务工单生成器/practice-task-workorder-generator/scripts/generate_work_orders.py" \
            --content-json "实践任务工单生成器/practice-task-workorder-generator/examples/software.example.json" \
            --output-dir "$workorder_dir/software" --replace --mode standalone --render --json > "$workorder_dir/software-report.json"
          python "实践任务工单生成器/practice-task-workorder-generator/scripts/generate_work_orders.py" \
            --content-json "实践任务工单生成器/practice-task-workorder-generator/examples/nursing.example.json" \
            --output-dir "$workorder_dir/nursing" --replace --mode standalone --render --json > "$workorder_dir/nursing-report.json"
          python - "$workorder_dir/software-report.json" "$workorder_dir/nursing-report.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          for raw_path in sys.argv[1:]:
              report = json.loads(Path(raw_path).read_text(encoding="utf-8"))
              if report.get("status") != "pass":
                  raise SystemExit(f"WorkOrder generation failed: {raw_path}: {report}")
              renders = [item.get("render", {}) for item in report.get("outputs", [])]
              # Contract: every requested render.status must be pass; skipped is not success.
              if not renders or any(item.get("status") != "pass" for item in renders):
                  raise SystemExit(f"WorkOrder render smoke was not a real pass: {raw_path}: {renders}")
          print("WorkOrder render smoke: all requested renders passed")
          PY

      - name: Verify WorkOrder worktree is clean on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: test -z "$(git status --porcelain)"

      - name: Verify WorkOrder worktree is clean on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) { $status; throw "Tests left changes in the worktree." }

  template-courseware:
    name: HTML courseware / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: classify-changes
    if: >-
      always() && needs.classify-changes.result == 'success' &&
      (needs.classify-changes.outputs.force_full == 'true' ||
      needs.classify-changes.outputs.run_courseware == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
          - os: macos-14
            python-version: "3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Compile and run Courseware unit tests
        run: |
          python -m compileall -q HTML课件生成器/courseware-html-generator
          python -m unittest discover -s HTML课件生成器/courseware-html-generator/tests -p "test_*.py" -v

      - name: Install Playwright browser for real interaction smoke
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/courseware-node" --no-save playwright
          "$RUNNER_TEMP/courseware-node/node_modules/.bin/playwright" install chromium

      - name: Generate and validate offline courseware
        shell: bash
        run: |
          set -euo pipefail
          # browser_smoke.mjs opens the output through file:// and asserts offline loading.
          output_dir="$RUNNER_TEMP/courseware-output"
          mkdir -p "$output_dir"
          python HTML课件生成器/courseware-html-generator/scripts/render_courseware.py \
            --content-json HTML课件生成器/courseware-html-generator/examples/data-structures.example.json \
            --output-dir "$output_dir" --replace --json > "$RUNNER_TEMP/courseware-generation.json"
          python HTML课件生成器/courseware-html-generator/scripts/validate_courseware.py \
            --content-json HTML课件生成器/courseware-html-generator/examples/data-structures.example.json \
            --student-html "$output_dir/student.html" \
            --teacher-html "$output_dir/teacher.html" --json
          COURSEWARE_PLAYWRIGHT_ROOT="$RUNNER_TEMP/courseware-node/node_modules/playwright" node \
            HTML课件生成器/courseware-html-generator/tests/browser_smoke.mjs \
            "$output_dir/student.html"

      - name: Verify Courseware worktree is clean
        shell: bash
        run: test -z "$(git status --porcelain)"

  practice-class-html:
    name: Practice Class HTML / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: classify-changes
    if: >-
      always() && needs.classify-changes.result == 'success' &&
      (needs.classify-changes.outputs.force_full == 'true' ||
      needs.classify-changes.outputs.run_practice_class == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python-version: "3.11"
          - os: macos-14
            python-version: "3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: .github/scripts/requirements-ci-practice-tests.txt

      - name: Install Practice test dependencies
        run: >-
          python .github/scripts/run_timed.py
          --label "practice test dependency setup"
          --
          python -m pip install
          -r .github/scripts/requirements-ci-practice-tests.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run Practice Class unit tests and compile
        run: |
          python -m compileall -q 实践课HTML生成器/practice-class-html-generator
          python -m unittest discover -s 实践课HTML生成器/practice-class-html-generator/tests -p "test_*.py" -v

      - name: Install Playwright browser for real practice interaction smoke
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/practice-class-node" --no-save playwright
          "$RUNNER_TEMP/practice-class-node/node_modules/.bin/playwright" install chromium

      - name: Generate all three practice fixtures and validate outputs
        shell: bash
        run: |
          set -euo pipefail
          skill="实践课HTML生成器/practice-class-html-generator"
          output_root="$RUNNER_TEMP/practice-class-output"
          mkdir -p "$output_root"
          python "$skill/scripts/render_practice.py" \
            --practice-json "$skill/examples/data-structures.practice.json" \
            --courseware-json "HTML课件生成器/courseware-html-generator/examples/data-structures.example.json" \
            --output-dir "$output_root/data-structures" --replace --json
          python "$skill/scripts/render_practice.py" \
            --practice-json "$skill/examples/uml.practice.json" \
            --courseware-json "HTML课件生成器/courseware-html-generator/examples/uml.example.json" \
            --output-dir "$output_root/uml" --replace --json
          python "$skill/scripts/render_practice.py" \
            --practice-json "$skill/examples/database.practice.json" \
            --courseware-json "$skill/examples/database-courseware.example.json" \
            --output-dir "$output_root/database" --replace --json
          python "$skill/scripts/validate_practice.py" --practice-json "$skill/examples/data-structures.practice.json" --courseware-json "HTML课件生成器/courseware-html-generator/examples/data-structures.example.json" --output-dir "$output_root/data-structures" --json
          python "$skill/scripts/validate_practice.py" --practice-json "$skill/examples/uml.practice.json" --courseware-json "HTML课件生成器/courseware-html-generator/examples/uml.example.json" --output-dir "$output_root/uml" --json
          python "$skill/scripts/validate_practice.py" --practice-json "$skill/examples/database.practice.json" --courseware-json "$skill/examples/database-courseware.example.json" --output-dir "$output_root/database" --json

      - name: Run Practice Class browser smoke and internal-link checks
        shell: bash
        env:
          PRACTICE_PLAYWRIGHT_ROOT: ${{ runner.temp }}/practice-class-node/node_modules/playwright
        run: |
          set -euo pipefail
          node 实践课HTML生成器/practice-class-html-generator/tests/browser_smoke.mjs "$RUNNER_TEMP/practice-class-output"

      - name: Verify Practice Class worktree is clean
        shell: bash
        run: test -z "$(git status --porcelain)"

  whole-course-orchestrator:
    name: Whole-Course Orchestrator
    needs: classify-changes
    if: >-
      always() && needs.classify-changes.result == 'success' &&
      (needs.classify-changes.outputs.force_full == 'true' ||
      needs.classify-changes.outputs.run_whole_course == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for whole-course browser evidence
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Chromium and Playwright for whole-course contact sheets
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/whole-course-node" --no-save playwright
          "$RUNNER_TEMP/whole-course-node/node_modules/.bin/playwright" install chromium

      - name: Compile Whole-Course Orchestrator
        run: python -m compileall -q 整门课程编排器/whole-course-orchestrator

      - name: Run synthetic architecture and real-browser evidence tests
        env:
          WHOLE_COURSE_PLAYWRIGHT_ROOT: ${{ runner.temp }}/whole-course-node/node_modules/playwright
        run: python -m unittest discover -s 整门课程编排器/whole-course-orchestrator/tests -p 'test_*.py' -v

      - name: Run strict downstream E2E and real contact-sheet proof
        shell: bash
        env:
          WHOLE_COURSE_PLAYWRIGHT_ROOT: ${{ runner.temp }}/whole-course-node/node_modules/playwright
        run: >-
          python 整门课程编排器/whole-course-orchestrator/scripts/downstream_e2e.py
          --output-dir "$RUNNER_TEMP/whole-course-e2e"
          --evidence-mode strict
          --json

      - name: Preserve migration-trust compatibility E2E as an intentional blocked regression
        shell: bash
        env:
          WHOLE_COURSE_PLAYWRIGHT_ROOT: ${{ runner.temp }}/whole-course-node/node_modules/playwright
        run: >-
          python 整门课程编排器/whole-course-orchestrator/scripts/downstream_e2e.py
          --output-dir "$RUNNER_TEMP/whole-course-migration-e2e"
          --evidence-mode migration-trust
          --expect-blocked
          --json

      - name: Replay real frozen whole-course failure benchmark
        shell: bash
        run: >-
          python 整门课程编排器/whole-course-orchestrator/scripts/replay_failure_benchmark.py
          --snapshot benchmarks/WHOLE_COURSE_FAILURE_BENCHMARK_V1/failure-evidence-snapshot.json
          --benchmark-json benchmarks/WHOLE_COURSE_FAILURE_BENCHMARK_V1/whole-course-failure-benchmark.json
          --output-json "$RUNNER_TEMP/whole-course-failure-replay.json"
          --expect-fail
          --json

      - name: Validate install dry-run
        run: python 整门课程编排器/whole-course-orchestrator/scripts/install.py --skills-dir "$RUNNER_TEMP/skills" --dry-run

      - name: Verify Whole-Course worktree is clean
        shell: bash
        run: test -z "$(git status --porcelain)"

  template-release:
    name: Template release / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs:
      - classify-changes
      - package-contracts
    if: >-
      always() && needs.classify-changes.result == 'success' &&
      needs.package-contracts.result == 'success' &&
      (needs.classify-changes.outputs.force_full == 'true' ||
      needs.classify-changes.outputs.run_release == 'true')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            教案生成器/lesson-plan-docx-generator/requirements.txt
            平时成绩记分册生成器/course-gradebook-generator/requirements.txt
            实践任务工单生成器/practice-task-workorder-generator/requirements.txt

      - name: Install LibreOffice on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: .github/scripts/install_libreoffice_macos.sh

      - name: Install LibreOffice on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $started = Get-Date
          choco install libreoffice-fresh --yes --no-progress
          $programPaths = @(
            (Join-Path $env:ProgramFiles "LibreOffice\program"),
            (Join-Path ${env:ProgramFiles(x86)} "LibreOffice\program")
          )
          $programPath = $programPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $programPath) { throw "LibreOffice installation path was not found." }
          $soffice = Join-Path $programPath "soffice.com"
          if (-not (Test-Path $soffice)) { throw "LibreOffice command was not found: $soffice" }
          & $soffice --version | Select-Object -First 1
          $seconds = [math]::Round(((Get-Date) - $started).TotalSeconds, 2)
          "- LibreOffice setup: ${seconds}s" | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Install Python dependencies
        run: >-
          python .github/scripts/run_timed.py
          --label "dependency setup"
          --
          python -m pip install
          -r 教案生成器/lesson-plan-docx-generator/requirements.txt
          -r 平时成绩记分册生成器/course-gradebook-generator/requirements.txt
          -r 实践任务工单生成器/practice-task-workorder-generator/requirements.txt

      - name: Validate template package release lifecycle
        run: >-
          python .github/scripts/run_timed.py
          --label "release lifecycle tests"
          --
          python -m unittest discover -s "tests" -p "test_template_package_release.py" -v

      - name: Compile release tooling
        run: python -m compileall -q "tools" ".github/scripts" "tests/test_template_package_release.py"

      - name: Verify release worktree is clean on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: test -z "$(git status --porcelain)"

      - name: Verify release worktree is clean on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $status = git status --porcelain
          if ($status) { $status; throw "Tests left changes in the worktree." }

  ci-gate:
    name: CI Gate
    if: always()
    needs:
      - classify-changes
      - documentation-checks
      - package-contracts
      - template-tooling
      - template-lesson
      - template-gradebook
      - template-workorder
      - template-courseware
      - practice-class-html
      - whole-course-orchestrator
      - template-release
    runs-on: ubuntu-latest
    steps:
      - name: Validate required checks
        env:
          CLASSIFY_RESULT: ${{ needs.classify-changes.result }}
          DOCUMENTATION_RESULT: ${{ needs.documentation-checks.result }}
          PACKAGE_RESULT: ${{ needs.package-contracts.result }}
          TOOLING_RESULT: ${{ needs.template-tooling.result }}
          LESSON_RESULT: ${{ needs.template-lesson.result }}
          GRADEBOOK_RESULT: ${{ needs.template-gradebook.result }}
          WORKORDER_RESULT: ${{ needs.template-workorder.result }}
          COURSEWARE_RESULT: ${{ needs.template-courseware.result }}
          PRACTICE_CLASS_RESULT: ${{ needs.practice-class-html.result }}
          WHOLE_COURSE_RESULT: ${{ needs.whole-course-orchestrator.result }}
          RELEASE_RESULT: ${{ needs.template-release.result }}
          RUN_DOCS: ${{ needs.classify-changes.outputs.run_docs }}
          RUN_PACKAGE: ${{ needs.classify-changes.outputs.run_package_contracts }}
          RUN_TOOLING: ${{ needs.classify-changes.outputs.run_tooling }}
          RUN_LESSON: ${{ needs.classify-changes.outputs.run_lesson }}
          RUN_GRADEBOOK: ${{ needs.classify-changes.outputs.run_gradebook }}
          RUN_WORKORDER: ${{ needs.classify-changes.outputs.run_workorder }}
          RUN_COURSEWARE: ${{ needs.classify-changes.outputs.run_courseware }}
          RUN_PRACTICE_CLASS: ${{ needs.classify-changes.outputs.run_practice_class }}
          RUN_WHOLE_COURSE: ${{ needs.classify-changes.outputs.run_whole_course }}
          RUN_RELEASE: ${{ needs.classify-changes.outputs.run_release }}
          FORCE_FULL: ${{ needs.classify-changes.outputs.force_full }}
          CLASSIFICATION: ${{ needs.classify-changes.outputs.classification }}
          REASON: ${{ needs.classify-changes.outputs.reason }}
          CHANGED_FILES: ${{ needs.classify-changes.outputs.changed_files }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$CLASSIFY_RESULT" != "success" ]]; then
            echo "classify-changes result: $CLASSIFY_RESULT"
            exit 1
          fi

          check_job() {
            local label="$1"
            local required="$2"
            local result="$3"
            if [[ "$required" == "true" ]]; then
              if [[ "$result" != "success" ]]; then
                echo "$label is required but finished as $result"
                exit 1
              fi
            elif [[ "$result" != "skipped" ]]; then
              echo "$label is not required but finished as $result"
              exit 1
            fi
          }

          check_job documentation-checks "$RUN_DOCS" "$DOCUMENTATION_RESULT"
          check_job package-contracts "$RUN_PACKAGE" "$PACKAGE_RESULT"
          check_job template-tooling "$RUN_TOOLING" "$TOOLING_RESULT"
          check_job template-lesson "$RUN_LESSON" "$LESSON_RESULT"
          check_job template-gradebook "$RUN_GRADEBOOK" "$GRADEBOOK_RESULT"
          check_job template-workorder "$RUN_WORKORDER" "$WORKORDER_RESULT"
          check_job template-courseware "$RUN_COURSEWARE" "$COURSEWARE_RESULT"
          check_job practice-class-html "$RUN_PRACTICE_CLASS" "$PRACTICE_CLASS_RESULT"
          check_job whole-course-orchestrator "$RUN_WHOLE_COURSE" "$WHOLE_COURSE_RESULT"
          check_job template-release "$RUN_RELEASE" "$RELEASE_RESULT"

          {
            echo "## CI Gate"
            echo
            echo "- Classification: `$CLASSIFICATION`"
            echo "- force_full: `$FORCE_FULL`"
            echo "- Reason: $REASON"
            echo
            echo "### Changed files"
            echo
            if [[ -n "$CHANGED_FILES" ]]; then
              printf '%s\n' "$CHANGED_FILES" | sed 's/^/- \`/; s/$/\`/'
            else
              echo "- none"
            fi
            echo
            echo "CI Gate: success"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "CI Gate: success"
