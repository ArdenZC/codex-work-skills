name: RQ-03F-B3-C2 Fixed Operator Launcher and TrustContext Provider

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/rq03f-b3c2-launcher-provider.yml
      - .github/scripts/run_test_shards.py
      - tests/test_run_test_shards.py
      - tests/test_rq03f_c2_operator_launcher.py
      - tools/rq03f_c2/**
      - tools/rq03f_c1/**
      - 教案生成器/lesson-plan-docx-generator/scripts/**
      - 教案生成器/lesson-plan-docx-generator/schemas/**
      - systemd/rq03f-operator-preflight.service
      - RQ03F_B3C2_FIXED_OPERATOR_LAUNCHER.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rq03f-b3c2-fixed-operator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  hosted-linux-real-uid:
    name: Disposable Ubuntu real-UID Launcher and Provider boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact PR head without persisting a GitHub token
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python for deterministic contract tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install disposable Linux runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y acl python3-pip python3-venv systemd

      - name: Install deterministic contract-test requirements
        run: >-
          python -m pip install
          --no-cache-dir
          -r 教案生成器/lesson-plan-docx-generator/requirements.txt

      - name: Check isolated test code and shell syntax
        run: |
          python -m py_compile \
            教案生成器/lesson-plan-docx-generator/scripts/rq03f_fixed_operator_launcher.py \
            教案生成器/lesson-plan-docx-generator/scripts/rq03f_operator_launch_policy.py \
            教案生成器/lesson-plan-docx-generator/scripts/rq03f_operator_trust_provider.py \
            tools/rq03f_c2/hosted_linux_isolation.py
          bash -n tools/rq03f_c1/hosted_linux_isolation.sh

      - name: Run C2 closed-contract and negative tests
        env:
          PYTHONPATH: 教案生成器/lesson-plan-docx-generator/scripts
        run: python -m unittest tests.test_rq03f_c2_operator_launcher -v

      - name: Run inherited C1 Linux real-UID regression
        run: bash tools/rq03f_c1/hosted_linux_isolation.sh

      - name: Run C2 synthetic Policy/Index with real Linux identities and filesystem permissions
        env:
          C2_EXPECTED_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rq03f-c2-evidence"
          sudo -n env C2_EXPECTED_SOURCE_COMMIT="$C2_EXPECTED_SOURCE_COMMIT" \
            python tools/rq03f_c2/hosted_linux_isolation.py \
            | tee "$RUNNER_TEMP/rq03f-c2-evidence/rq03f-b3c2-hosted-evidence.json"

      - name: Verify no temporary C2 identities or authority paths remain
        if: always()
        shell: bash
        run: |
          failed=0
          if sudo -n test -e /etc/rq03f; then
            echo "synthetic C2 config path remains: /etc/rq03f"
            failed=1
          fi
          if sudo -n find /var/lib -maxdepth 1 -type d -name 'rq03f-c2-*' -print -quit | grep -q .; then
            echo "synthetic C2 generation path remains"
            failed=1
          fi
          for user in $(getent passwd | awk -F: '$1 ~ /^rq03c2-/ {print $1}'); do
            echo "temporary C2 user remains: $user"
            failed=1
          done
          for group in $(getent group | awk -F: '$1 ~ /^rq03c2-/ {print $1}'); do
            echo "temporary C2 group remains: $group"
            failed=1
          done
          exit "$failed"

      - name: Upload synthetic C2 execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rq03f-b3c2-hosted-launcher-provider-${{ github.run_id }}
          path: ${{ runner.temp }}/rq03f-c2-evidence/rq03f-b3c2-hosted-evidence.json
          if-no-files-found: warn
          retention-days: 14
