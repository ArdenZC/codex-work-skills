name: RQ-03F-B3-C1 Operator Infrastructure

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/rq03f-b3c1-operator-infrastructure.yml
      - tools/rq03f_c1/**
      - tests/test_rq03f_c1_operator_infrastructure.py
      - RQ03F_B3C1_INFRASTRUCTURE_FOUNDATION.md
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rq03f-b3c1-operator-infrastructure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  hosted-linux-real-uid:
    name: Disposable Ubuntu real-UID and filesystem checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact PR head without persisting a GitHub token
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install POSIX ACL inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y acl

      - name: Check the isolated test harness
        run: bash -n tools/rq03f_c1/hosted_linux_isolation.sh

      - name: Run C1 deterministic suite under separate Linux UIDs
        run: bash tools/rq03f_c1/hosted_linux_isolation.sh

      - name: Verify temporary users and protected test files were removed
        if: always()
        shell: bash
        run: |
          failed=0
          for role in operator candidate author reviewer approver; do
            user="rq03f-c1-${role}"
            if getent passwd "$user" >/dev/null || getent group "$user" >/dev/null; then
              echo "temporary identity remains: $user"
              failed=1
            fi
          done
          path="/var/lib/rq03f-c1-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if sudo -n test -e "$path"; then
            echo "temporary test directory remains: $path"
            failed=1
          fi
          exit "$failed"

      - name: Upload actual-UID and filesystem evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rq03f-b3c1-hosted-uid-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/rq03f-c1-evidence/
          if-no-files-found: warn
          retention-days: 14
