template:
  id: course-gradebook
  name: 湖北职业技术学院学生平时成绩登记表
  version: 1.1.0
  format: xls
  file: template.xls
  base_manifest: ../v1.0.0/manifest.yaml
  base_template: ../v1.0.0/template.xls
generator:
  version: 1.1.0
  supported_major: 1
structure:
  source:
    metadata_line2_cell: A2
    metadata_line3_cell: A3
    header_row: 4
    data_start_row: 5
    headers:
      student_id: 学号
      student_name: 姓名
      regular: 平时成绩
      theory: 理论成绩
      skill: 技能成绩
      total: 总成绩
anchors:
  mode: excel_named_range
  scope: workbook
  required:
  - gb_title
  - gb_term
  - gb_course
  - gb_teacher
  - gb_class_name
  - gb_header_serial
  - gb_header_student_id
  - gb_header_student_name
  - gb_header_regular
  - gb_header_theory
  - gb_header_skill
  - gb_header_total
  - gb_data_table
  - gb_template_row
  - gb_serial_col
  - gb_student_id_col
  - gb_student_name_col
  - gb_regular_items
  - gb_regular_weighted_col
  - gb_theory_score_col
  - gb_theory_weighted_col
  - gb_skill_score_col
  - gb_skill_weighted_col
  - gb_total_score_col
  definitions:
    gb_title:
      kind: cell
      role: title
    gb_term:
      kind: cell
      role: metadata
    gb_course:
      kind: cell
      role: metadata
    gb_teacher:
      kind: cell
      role: metadata
    gb_class_name:
      kind: cell
      role: metadata
    gb_header_serial:
      kind: cell
      role: header
    gb_header_student_id:
      kind: cell
      role: header
    gb_header_student_name:
      kind: cell
      role: header
    gb_header_regular:
      kind: cell
      role: header
    gb_header_theory:
      kind: cell
      role: header
    gb_header_skill:
      kind: cell
      role: header
    gb_header_total:
      kind: cell
      role: header
    gb_data_table:
      kind: matrix
      role: data_table
    gb_template_row:
      kind: row
      role: template_row
    gb_serial_col:
      kind: column
      role: serial
    gb_student_id_col:
      kind: column
      role: student_id
    gb_student_name_col:
      kind: column
      role: student_name
    gb_regular_items:
      kind: matrix
      columns: 8
      role: regular_scores
    gb_regular_weighted_col:
      kind: column
      role: regular_weighted
    gb_theory_score_col:
      kind: column
      role: theory_score
    gb_theory_weighted_col:
      kind: column
      role: theory_weighted
    gb_skill_score_col:
      kind: column
      role: skill_score
    gb_skill_weighted_col:
      kind: column
      role: skill_weighted
    gb_total_score_col:
      kind: column
      role: total_score
  variants:
    with_skill:
      required:
      - gb_title
      - gb_term
      - gb_course
      - gb_teacher
      - gb_class_name
      - gb_header_serial
      - gb_header_student_id
      - gb_header_student_name
      - gb_header_regular
      - gb_header_theory
      - gb_header_skill
      - gb_header_total
      - gb_data_table
      - gb_template_row
      - gb_serial_col
      - gb_student_id_col
      - gb_student_name_col
      - gb_regular_items
      - gb_regular_weighted_col
      - gb_theory_score_col
      - gb_theory_weighted_col
      - gb_skill_score_col
      - gb_skill_weighted_col
      - gb_total_score_col
      forbidden: []
    without_skill:
      required:
      - gb_title
      - gb_term
      - gb_course
      - gb_teacher
      - gb_class_name
      - gb_header_serial
      - gb_header_student_id
      - gb_header_student_name
      - gb_header_regular
      - gb_header_theory
      - gb_header_total
      - gb_data_table
      - gb_template_row
      - gb_serial_col
      - gb_student_id_col
      - gb_student_name_col
      - gb_regular_items
      - gb_regular_weighted_col
      - gb_theory_score_col
      - gb_theory_weighted_col
      - gb_total_score_col
      forbidden:
      - gb_header_skill
      - gb_skill_score_col
      - gb_skill_weighted_col
fields:
  term:
    target: named_range
    name: gb_term
    mode: replace_value
    max_chars: 32
  course:
    target: named_range
    name: gb_course
    mode: replace_value
    max_chars: 64
  teacher:
    target: named_range
    name: gb_teacher
    mode: replace_value
    max_chars: 32
  class_name:
    target: named_range
    name: gb_class_name
    mode: replace_value
    max_chars: 64
  student_id:
    target: named_range
    name: gb_student_id_col
    mode: text
    pattern: ^\d{8,}$
  regular_scores:
    target: named_range
    name: gb_regular_items
    mode: decimal_half
    average_matches: students.regular
  theory_score:
    target: named_range
    name: gb_theory_score_col
    mode: number
  skill_score:
    target: named_range
    name: gb_skill_score_col
    mode: number
    optional_when: weights.skill == 0
  formula_columns_with_skill:
    names:
    - gb_regular_weighted_col
    - gb_theory_weighted_col
    - gb_skill_weighted_col
    - gb_total_score_col
    mode: formula
  formula_columns_without_skill:
    names:
    - gb_regular_weighted_col
    - gb_theory_weighted_col
    - gb_total_score_col
    mode: formula
layout:
  worksheet_from: gb_data_table
  data_table: gb_data_table
  template_row: gb_template_row
  columns:
    serial: gb_serial_col
    student_id: gb_student_id_col
    student_name: gb_student_name_col
    regular_items: gb_regular_items
    regular_weighted: gb_regular_weighted_col
    theory_score: gb_theory_score_col
    theory_weighted: gb_theory_weighted_col
    skill_score: gb_skill_score_col
    skill_weighted: gb_skill_weighted_col
    total_score: gb_total_score_col
allowed_changes:
- named ranges declared under fields and layout
- student rows within gb_data_table through the generated last row
- regular score cells, theory score, optional skill score and declared formula ranges
- deletion of the two skill columns when weights.skill is zero
protected:
- workbook sheet names and non-target sheets
- merged ranges, page setup, print settings, widths, heights and base styles
- header labels except declared percentage text
- formulas and number formats outside declared output columns
- student ID text format
validation:
  required_headers:
  - 序号
  - 学号
  - 姓名
  - 平时成绩(20%)
  - 理论成绩(50%)
  - '总评

    成绩'
  template_data_rows: 48
  regular_item_count: 8
  require_formula_columns: true
  require_student_id_text: true
  require_xls_open: true
  expected_print_area: ''
  require_print_area: false
  page_orientation: landscape
  expected_freeze_panes: null
  required_named_ranges:
  - gb_title
  - gb_term
  - gb_course
  - gb_teacher
  - gb_class_name
  - gb_header_serial
  - gb_header_student_id
  - gb_header_student_name
  - gb_header_regular
  - gb_header_theory
  - gb_header_skill
  - gb_header_total
  - gb_data_table
  - gb_template_row
  - gb_serial_col
  - gb_student_id_col
  - gb_student_name_col
  - gb_regular_items
  - gb_regular_weighted_col
  - gb_theory_score_col
  - gb_theory_weighted_col
  - gb_skill_score_col
  - gb_skill_weighted_col
  - gb_total_score_col
  required_data_validations: 0
  required_conditional_formats: 0
  require_no_formula_errors: true
fingerprint:
  algorithm: sha256
  sha256: FEA186D65DCE742FC7DD0370FF24C60D8D5A1004BC357D99FC75F22F06B9C28E
  value: FEA186D65DCE742FC7DD0370FF24C60D8D5A1004BC357D99FC75F22F06B9C28E
