interface:
  display_name: "教案生成器"
  short_description: "按项目化模板批量生成中文教案 DOCX"
  default_prompt: >-
    使用 $lesson-plan-docx-generator 生成符合 Lesson Content Contract 2.2 的项目化中文教案 DOCX；先读取当前会话、已有附件和 SKILL.md，进入 INTAKE_PENDING。正式规划前必须只做一次全中文课程基本信息确认，集中展示课程名称、专业、授课对象、总课时，并同时显示理论课时、实践课时、理论与实践组织方式、单课课时默认 2 学时、使用教材、辅助参考资料和是否同时生成实践任务工单。四个核心字段缺失时显示“待补充”，总课时只能使用用户明确提供的事实；未明确提供的理论/实践结构、组织方式和工单偏好显示“待确认”，不得默认 50/50、综合式或“否”；推断的专业或授课对象标注“当前理解 / 如不准确请修改”。教材是建议确认但不是必填，未指定也继续；默认单课 2 学时，不单独追问。用户确认后直接完成资料检索、课程级 outline、必要时的 Practice Task Contract、完整 JSON、QA 和 DOCX，不再询问 outline、项目/任务、评分、模板、输出目录或是否开始生成 DOCX。Lesson DOCX 只承载理论课时，理论课次数量按理论课时除以默认单课课时向上取整并保留余数；只有用户明确需要实践工单时才生成 Practice Task Contract 和 handoff，实践学时必须为正偶数，每个 Practice Task 固定 2 学时，任务数与 WorkOrder 数均等于实践学时除以 2，project_id 只用于分组；明确不需要时实践学时仍计入课程总账，但不生成 contract、handoff、WorkOrder 或实践侧额外文件。若需要实践工单，Lesson Agent 完成 Lesson QA 和 handoff 后调用 WorkOrder Skill Agent；不可用时明确 实践任务工单生成器当前不可用，已保存实践任务数据文件，可在工单生成器可用后继续生成。 不伪造工单，禁止 Lesson Python subprocess 调用 WorkOrder generator。references 只放可阅读或可引用的文献/文档来源，resources 放工具、设备、环境和教学材料；课程级参考资料优先使用用户资料、国内出版物/高校资料、国家和行业标准及国内权威文件，真实来源可跨课复用。教材默认不作为 references；禁止把投影仪、PPT、MySQL Workbench、血压计等资源当参考文献，也禁止为了降低重复率虚构作者、出版社、ISBN、版次或标准编号。
    Lesson Skill 2.2.2 hotfix：用户确认后的课程名称、专业、授课对象、总课时、理论课时、实践课时和理论与实践组织方式必须作为已确认课程信息快照原样冻结，正文 Agent 不得重写；2.2.2 中教材、PPT、课件、案例表/案例数据、内部教学资源、任务单和设备不能进入 references，教材作为参考文献的例外开关不可用；有联网能力时生成前必须实际检索真实公开外部来源，证据 URL 只留 JSON/QA，Word 仅输出规范书目；正文不得注入或保留“（聚焦：...）”“围绕：...”等机械主题尾缀。
    参考文献可见文本必须保留真实责任者信息：正式出版物写真实作者/编者、出版社和年份；在线课程写责任教师/课程团队、开课高校和课程平台/出版社，不能只写平台名称。优先混合正式出版物与高校公开课程，继续严格排除当前课程教材。
    Lesson 时间合同补丁：每个 Lesson 的课前准备固定 10 分钟，课后完善固定 15 分钟；中间七个课中阶段仍严格按 hours×45 计时，2 学时必须合计 90 分钟。课前与课后属于课外学习活动，不计入 theory_hours、total_hours 或课堂 2 学时。生成 Content JSON 时直接写入 before_class_preparation.minutes=10、after_class_improvement.minutes=15，不得使用 0 分钟；若 SKILL.md 中存在旧的“课外阶段可为 0 分钟”兼容描述，以本时间合同为准。
