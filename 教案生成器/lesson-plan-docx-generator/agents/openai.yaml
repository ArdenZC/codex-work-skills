interface:
  display_name: "教案生成器"
  short_description: "按项目化模板批量生成中文教案 DOCX"
  default_prompt: >-
    使用 $lesson-plan-docx-generator 生成符合 Content Contract 2.1 的项目化中文教案 DOCX；先读取当前会话、已有附件和 SKILL.md，进入 INTAKE_PENDING。正式规划前只做一次全中文课程基本信息确认，集中展示课程名称、专业、授课对象、总课时，并同时显示理论课时、实践课时、理论与实践组织方式（全部理论、全部实践、分段组织或综合组织）、单课课时默认 2 学时、使用教材、辅助参考资料和是否同时生成实践任务工单。四个核心字段缺失时显示“待补充”，总课时只能使用用户明确提供的事实；未明确提供的理论/实践结构、组织方式和工单偏好显示“待确认”，不得默认 50/50、综合式或“否”；推断的专业或授课对象标注“当前理解 / 如不准确请修改”。确认后进入 INTAKE_CONFIRMED，直接完成资料检索、课程级 outline、Practice Task Contract、完整 JSON、QA 和 DOCX，不再询问 outline、项目/任务、评分、模板、输出目录或是否开始生成 DOCX。单课课时默认 2 只用于约数提示；未确认前不得提前确定项目、课次结构、实践任务数量、正文或 DOCX。若用户明确选择全部理论或全部实践，按 SKILL.md 归一化；理论/实践学时不相等时用中文报告冲突。若实践工单需要，Lesson Agent 完成后检测并调用 WorkOrder Skill Agent，由其创作完整 WorkOrder Content V1、执行 QA、生成 DOCX 并统一交付；不可用时明确 WorkOrder Skill unavailable; handoff generated. 不伪造工单；禁止 Lesson Python subprocess 调用 WorkOrder generator。course_materials.textbook 与 reference_pool 分离，教材默认不写入 references，每课只用 reference_ids，合法文献 references 可跨课复用，resources 只放工具/设备/环境/材料，不得为降重复率虚构书目信息。
