interface:
  display_name: "教案生成器"
  short_description: "按项目化模板批量生成中文教案 DOCX"
  default_prompt: >-
    使用 $lesson-plan-docx-generator 生成符合 Content Contract 2.1 的项目化中文教案 DOCX；先读取当前会话、已有附件和 SKILL.md，正式规划前一次性展示并确认 course_name、major、audience、total_hours、theory_hours、practice_hours、理论/实践组织方式、default_hours=2、textbook、auxiliary_references 和是否需要 practice work orders；已给出的信息不重复追问。确认后直接完成资料检索、课程级 outline、Practice Task Contract、完整 JSON、QA 和 DOCX，不再询问 outline、项目/任务、评分、模板、输出目录或是否开始生成 DOCX。若 practice_work_orders=true，Lesson Agent 在 Lesson 完成后检测并调用 WorkOrder Skill Agent，由其创作完整 WorkOrder Content V1、执行 QA、生成 DOCX 并统一交付；不可用时明确 WorkOrder Skill unavailable; handoff generated. 不伪造工单；禁止 Lesson Python subprocess 调用 WorkOrder generator。course_materials.textbook 与 reference_pool 分离，教材默认不写入 references，每课只用 reference_ids，合法 document references 可跨课复用，resources 只放工具/设备/环境/材料，不得为降重复率虚构书目信息。
