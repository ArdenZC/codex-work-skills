interface:
  display_name: "教案生成器"
  short_description: "按项目化模板批量生成中文教案 DOCX"
  default_prompt: >-
    使用教案生成器 2.2.3 生成项目化中文教案 DOCX。先读取同目录 SKILL.md、通用提示词和用户资料，进入 INTAKE_PENDING，并只做一次全中文课程基本信息确认；确认后冻结课程事实，先完成整门课程 outline，再生成完整 Lesson Content Contract 2.2、内容 QA、模板 QA、输出 QA 和真实渲染。Lesson DOCX 只承载理论课时；每课课前准备 10 分钟、七个课中阶段合计课堂学时乘 45 分钟、课后完善 15 分钟，1 学时内容必须实质少于 2 学时。教材、教学资源和可引用参考资料分开管理，资料不足时少写，不伪造书目信息。只有用户明确要求实践任务工单时，才由 Lesson Agent 在理论教案完成后把已确认的实践任务交给 WorkOrder Skill Agent；实践任务固定 2 学时并按实践总学时确定数量。工单生成器不可用时明确告知并保存实践任务数据文件，不伪造工单；不得用 Python 跨调用工单生成器。所有正文和教学判断由 Agent 提供，脚本只负责确定性结构、硬事实、格式、模板映射、输出和渲染门禁。
