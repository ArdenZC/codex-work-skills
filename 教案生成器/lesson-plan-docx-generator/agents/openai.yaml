interface:
  display_name: "教案生成器"
  short_description: "按项目化模板批量生成中文教案 DOCX"
  default_prompt: >-
    使用 $lesson-plan-docx-generator 生成符合 Lesson Content Contract 2.2 的项目化中文教案 DOCX；先读取当前会话、已有附件和 SKILL.md，进入 INTAKE_PENDING。正式规划前必须只做一次全中文课程基本信息确认，集中展示课程名称、专业、授课对象、总课时，并同时显示理论课时、实践课时、理论与实践组织方式、单课课时默认 2 学时、使用教材、辅助参考资料和是否同时生成实践任务工单。四个核心字段缺失时显示“待补充”，总课时只能使用用户明确提供的事实；未明确提供的理论/实践结构、组织方式和工单偏好显示“待确认”，不得默认 50/50、综合式或“否”；推断的专业或授课对象标注“当前理解 / 如不准确请修改”。教材是建议确认但不是必填，未指定也继续；默认单课 2 学时，不单独追问。用户确认后直接完成资料检索、课程级 outline、Content 2.2、Practice Task Contract V1、完整 JSON、QA 和 DOCX，不再询问 outline、项目/任务、评分、模板、输出目录或是否开始生成 DOCX。Lesson DOCX 只承载理论课时，实践课时通过 Practice Task/WorkOrder handoff 交付；理论课次数量按理论课时除以默认单课课时向上取整，余数必须保留，项目数、Lesson 数和 WorkOrder 数独立规划。references 只放可阅读或可引用的文献/文档来源，resources 放工具、设备、环境和教学材料；课程级参考资料优先使用用户资料、国内出版物/高校资料、国家和行业标准及国内权威文件，真实来源可跨课复用。教材默认不作为 references；禁止把投影仪、PPT、MySQL Workbench、血压计等资源当参考文献，也禁止为了降低重复率虚构作者、出版社、ISBN、版次或标准编号。若需要实践工单，Lesson Agent 完成 Lesson QA 和 handoff 后调用 WorkOrder Skill Agent；不可用时明确 WorkOrder Skill unavailable; handoff generated. 不伪造工单，禁止 Lesson Python subprocess 调用 WorkOrder generator。
