template:
  id: lesson-plan
  name: 中文项目化课程教案模板
  version: 1.1.2
  format: docx
  file: template.docx
  base_manifest: v1.1.1/manifest.yaml
  base_template: v1.1.1/template.docx
  patches:
    visible_text_replacements:
      - from: 平凡又不平凡的价值观
        to: 职业价值观
      - from: 工程伦理
        to: 职业伦理
generator:
  version: 1.1.2
  supported_major: 1
