template:
  id: lesson-plan
  name: 中文项目化课程教案模板
  version: 1.0.0
  format: docx
  file: assets/templates/lesson-plan/v1.0.0/template.docx
  compatibility_entries:
    - assets/lesson-plan-template.docx
generator:
  supported_major: 1
structure:
  top_level_tables: 1
  main_table:
    index: 0
    rows: 30
    columns: 10
  title:
    paragraph: 0
  evaluation_table:
    table: 0
    row: 12
    cell: 1
    rows: 14
    columns: 4
fields:
  course_name: {table: 0, row: 0, cell: 1, mode: replace_single_paragraph, max_chars: 32}
  major: {table: 0, row: 0, cell: 3, mode: replace_single_paragraph, max_chars: 32}
  audience: {table: 0, row: 0, cell: 5, mode: replace_single_paragraph, max_chars: 32}
  unit: {table: 0, row: 1, cell: 1, mode: replace_single_paragraph, max_chars: 60}
  task: {table: 0, row: 1, cell: 3, mode: replace_single_paragraph, max_chars: 80}
  hours: {table: 0, row: 1, cell: 5, mode: replace_single_paragraph, max_chars: 12}
  student_base: {table: 0, row: 3, cell: 1, mode: replace_multiline, max_chars: 600}
  student_problems: {table: 0, row: 3, cell: 2, mode: replace_multiline, max_chars: 600}
  student_strategy: {table: 0, row: 3, cell: 3, mode: replace_multiline, max_chars: 600}
  teaching_content: {table: 0, row: 4, cell: 1, mode: replace_multiline, max_chars: 1200}
  quality_goal: {table: 0, row: 6, cell: 1, mode: replace_multiline, max_chars: 600}
  knowledge_goal: {table: 0, row: 6, cell: 2, mode: replace_multiline, max_chars: 600}
  ability_goal: {table: 0, row: 6, cell: 3, mode: replace_multiline, max_chars: 600}
  key_content: {table: 0, row: 7, cell: 1, mode: replace_multiline, max_chars: 300}
  key_strategy: {table: 0, row: 7, cell: 2, mode: replace_multiline, max_chars: 300}
  difficult_content: {table: 0, row: 8, cell: 1, mode: replace_multiline, max_chars: 300}
  difficult_strategy: {table: 0, row: 8, cell: 2, mode: replace_multiline, max_chars: 300}
  teaching_methods: {table: 0, row: 9, cell: 1, mode: replace_multiline, max_chars: 300}
  resources: {table: 0, row: 10, cell: 1, mode: replace_multiline, max_chars: 1000}
  references: {table: 0, row: 11, cell: 1, mode: replace_multiline, max_chars: 700}
  implementation:
    mode: row_cells
    rows: [16, 18, 19, 20, 21, 22, 23, 24, 26]
    cells: [0, 1, 2, 3, 4]
    max_chars: 600
  reflection:
    mode: row_cells
    rows: [27, 28, 29]
    cells: [2]
    max_chars: 400
  evaluation: {table: 0, row: 12, cell: 1, mode: nested_table, rows: 14, columns: 4}
allowed_changes:
  - title paragraph text and alignment
  - declared lesson fields in the main table
  - evaluation score and remark cells in the nested evaluation table
  - declared teaching implementation and reflection cells
protected:
  - page size and section margins
  - headers, footers, relationships and embedded resources
  - main table row and column count
  - merged-cell topology and fixed label cells
  - row heights, column widths and base styles
  - evaluation table row and column count
validation:
  required_labels: [课程名称, 授课专业, 授课对象, 单元名称, 任务名称, 学时, 学情分析, 教学内容, 教学目标, 教学重点, 教学难点, 教学策略, 教学资源, 参考文献, 教学评价, 教学实施, 教学反思]
  main_table_rows: 30
  main_table_columns: 10
  evaluation_rows: 14
  evaluation_columns: 4
  score_total: 100
  score_tolerance: 0.1
  require_docx_open: true
fingerprint:
  algorithm: sha256
  sha256: 11783108468204DD67C9F8EAA1543B67279361ECC842A8B37F8541BDD01D16D5
