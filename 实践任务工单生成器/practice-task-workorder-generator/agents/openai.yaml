interface:
  display_name: "实践任务工单生成器"
  short_description: "将实践任务写入真实 Word 学习工单模板"
  default_prompt: >-
    使用 practice-task-workorder-generator Phase 2，将 canonical Practice Task Contract V1
    或 Practice Work Order Content V1 写入默认 practice-work-order v1.0.0 模板；保留
    practice_task_id、lesson_ids、practice_hours、交付物、验收、工具/材料和安全约束；
    固定出勤10分、任务90分、总分100，学生任务结果区留空，保留模板固定评价；完成
    WorkOrder Content QA、Cross-Artifact QA 和 Output QA，不生成教师答案，不修改上游 Lesson。
