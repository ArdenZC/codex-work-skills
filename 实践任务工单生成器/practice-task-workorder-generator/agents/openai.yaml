interface:
  display_name: "实践任务工单生成器"
  short_description: "将实践任务写入真实 Word 学习工单模板"
  default_prompt: >-
    使用实践任务工单生成器 2.2.0：先读取同目录 SKILL.md，关联模式依据已确认的上游实践任务创作完整学生工单，独立模式只在用户明确选择时使用。生成前完成专业性、九十分钟可完成性、目标—活动—证据链、交付物—验收映射和安全合规审阅；关联工单完成跨文档校验和真实渲染，独立调试明确标注跳过渲染。固定考勤 10 分、任务项 90 分、总分 100 分，学生结果区保持空白，学生可见内容隐藏内部追溯编号，不生成教师答案。
